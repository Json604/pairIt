ntent:center;gap:4px;font-size:11px;border-radius:28px}.nav button.active{background:#eee;color:#111}.home{width:100px;height:4px;border-radius:8px;background:#ffffff77;margin:0 auto;flex-shrink:0}.demoTag{position:absolute;right:17px;top:59px;font-size:9px;letter-spacing:1px;color:#b7c2cf;border:1px solid #ffffff33;border-radius:20px;padding:5px 7px}.listen{flex:1;display:grid;place-content:center;justify-items:center;gap:21px}.listen>svg{width:65px;height:65px}.wave{display:flex;gap:4px;height:28px;align-items:center}.wave i{display:block;width:4px;height:20px;border-radius:4px;background:white;animation:wave .8s ease-in-out infinite alternate}.wave i:nth-child(2n){animation-delay:-.4s;height:10px}.wave i:nth-child(3n){animation-delay:-.2s;height:28px}.seg{display:flex;background:#e8e8e9;border-radius:14px;padding:4px;gap:4px}.seg button{flex:1;font-size:12px;padding:12px 5px;border-radius:11px;background:none}.seg .active{background:#111;color:#fff}.notification{border-radius:23px;background:#f5f5f7;color:#171719;padding:18px;width:100%;box-shadow:0 6px 20px #0002}.notification small{font-size:10px;color:#65666c}.notification strong{display:block;margin:12px 0 4px;font-size:17px}.notification .controls{display:flex;gap:6px;margin-top:18px}.notification .controls button{flex:1;padding:11px 5px;background:#e5e5e7;border-radius:10px;font-size:11px}.notification .controls button:first-child{background:#111;color:#fff}.coach{position:absolute;left:15px;right:15px;background:white;color:#18191b;border-radius:22px;padding:18px;z-index:6;box-shadow:0 12px 40px #0004;animation:enter .22s cubic-bezier(.22,1,.36,1)}.coach h3{font-size:20px;letter-spacing:-.6px;margin:8px 0}.coach p{font-size:13px;margin:0 0 14px;line-height:1.45;color:#666}.coach .meta{display:flex;justify-content:space-between;font-size:11px;color:#777;align-items:center}.textbutton{background:none;padding:7px 0;color:#666;font-size:12px;min-width:44px}.coach .bottom{display:flex;align-items:center;gap:12px}.coach .bottom .primary{flex:1}.coach .bottom .textbutton{flex-shrink:0}.spot{position:relative!important;z-index:5!important;box-shadow:0 0 0 5px #fff,0 0 0 1000px #000a!important;border-radius:20px}.shade{position:absolute;inset:0;background:#0009;z-index:4;pointer-events:none}.hint{border:1px solid #ffffff55;background:#10131a;color:white;padding:13px 15px;border-radius:15px;animation:enter .2s ease-out}.hint p{color:#d0d2d7;font-size:12px;margin:5px 0}.hint b{font-size:13px}.hint footer{display:flex;align-items:center;justify-content:space-between;gap:8px}.hint button{color:#fff;background:#ffffff16;padding:8px 11px;border-radius:8px;font-size:11px;min-height:36px}.deck{position:absolute;inset:95px 16px 17px;display:flex;flex-direction:column;gap:17px}.deck h2{font-size:29px;letter-spacing:-.8px;margin:0}.deck p{font-size:14px;line-height:1.5;color:#ccc;margin:0}.deck .visual{flex:1;display:flex;align-items:center;min-height:150px}.deck .visual>.card{width:100%}.deck .steps{display:flex;gap:6px;justify-content:center}.deck .steps i{height:4px;width:23px;border-radius:5px;background:#ffffff33}.deck .steps i.on{background:#fff}.deck .skip{display:flex;justify-content:space-between;align-items:center}.deck .skip button{color:#ccc;background:none;padding:12px;font-size:12px}.result{font-size:12px;text-align:center;min-height:18px;color:#727780;line-height:1.4}.result.light{color:#d9e6f8}.completion{position:absolute;inset:160px 18px auto;background:white;color:#111;padding:25px;border-radius:27px;text-align:center;z-index:7}.completion .disc{margin:0 auto 17px;background:#e9e9eb}.completion h2{font-size:26px;letter-spacing:-1px}.completion p{font-size:14px}.about h2{font-size:19px;letter-spacing:-.5px}.about p{font-size:13px}.about ol{padding-left:17px;font-size:13px;line-height:2;color:#65707b}.about .note{border-top:1px solid #ccd1d6;margin-top:24px;padding-top:15px}.success{animation:enter .2s ease-out}@keyframes enter{from{opacity:0;transform:translateY(9px)}t /* The device frame/status bar belong to the OS. The approved deck fills its safe viewport. */
html,body{height:100%;background:#000;color:#fff;margin:0;-webkit-text-size-adjust:100%}
.phone{width:100%;height:100%;min-height:560px;border:0;border-radius:0;box-shadow:none;overflow:visible}
.brand{height:59px;padding:17px 20px 0;align-items:center}
.demoTag{top:23px}
.deck{inset:59px 16px 17px}
.deck .home{display:none}
.deck .visual{width:100%}
.deck>h2,.deck>p{flex-shrink:0}
.deck .skip{min-height:42px;flex-shrink:0}
.deck .visual>.notification{width:100%}
button{touch-action:manipulation}
.deck .steps{flex-shrink:0}
@media(max-height:600px){.phone{min-height:650px}}
</style></head><body><svg class="defs"><symbol id="icon-headphones" viewBox="0 0 24 24"><path d="M3 13v-2a9 9 0 0 1 18 0v2M3 12H6v9H3a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1ZM21 12H18v9h3a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1Z"/></symbol><symbol id="icon-laptop" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="13" rx="1.5"/><path d="m4 16-2 5h20l-2-5M9 18.5h6"/></symbol><symbol id="icon-phone" viewBox="0 0 24 24"><rect x="6" y="1" width="12" height="22" rx="3"/><path d="M10 4h4M10 20h4"/></symbol><symbol id="icon-qr" viewBox="0 0 24 24"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h3v3h3v3h-6"/></symbol><symbol id="icon-people" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M2 23v-3a7 7 0 0 1 14 0v3M17 3a4 4 0 0 1 0 8M20 23v-4a6 6 0 0 0-2-4"/></symbol><symbol id="icon-settings" viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18"/><circle cx="8" cy="5" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="19" r="2"/></symbol><symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol></svg>
<main class="phone" id="phone" aria-label="Try it first"></main><script>
const $=s=>document.querySelector(s),icon=n=>`<svg aria-hidden="true"><use href="#icon-${n}"/></svg>`;
let platform=location.hash.includes('ios')?'iOS':'Android',step=0,action=false,paused=false,computer=false,disconnected=false;
const titles=['Connect your computer','Choose where to listen','Control without opening PairIt','Bring another listener'];
const copy=['Tap a nearby computer. If it isn’t listed, use Scan QR.','Switch output without disconnecting. Output picks headphones; Audio has volume and Refresh audio.','','Open Together to find phones with PairIt nearby, then share the app. Each phone pairs with the same computer.'];
function message(){return step===2?(platform==='Android'?'Swipe down for Pause, Computer output, and Disconnect. After a call, tap Resume.':'Use Now Playing to pause or resume. Open PairIt to change output or disconnect.'):copy[step]}
function notification(){
 if(disconnected)return `<div class="notification"><small>PairIt</small><strong>Disconnected</strong><div class="controls"><button data-action="try-again">Try again</button></div></div>`;
 const state=computer?'Playing on computer':paused?'Audio paused':'Playing on phone';
 return `<div class="notification" id="target"><small>${platform==='iOS'?'NOW PLAYING':'PairIt'}</small><strong>${platform==='iOS'?'Computer audio':'MacBook Pro'}</strong><small>${platform==='iOS'?'PairIt':state}</small><div class="controls"><button data-action="pause" aria-label="${computer?'Listen here':paused?'Resume':'Pause'}">${computer?'▶ Listen here':paused?'▶ Resume':'Ⅱ Pause'}</button>${platform==='Android'?'<button data-action="notify-output">Computer</button><button data-action="disconnect">Disconnect</button>':''}</div></div>`;
}
function output(){return `<div class="card" id="target"><h3>Audio output</h3><div class="seg"><button class="${!computer?'active':''}" data-action="phone">Headphones</button><button class="${computer?'active':''}" data-action="computer">Computer</button></div><div class="tiles"><button data-action="route">${icon('headphones')}Output</button><button data-action="audio">${icon('settings')}Audio</button><button data-action="more">•••<span>More</span></button></div><div class="result">${action?(computer?'Computer speakers selected. Still connected.':'Phone headphones selected. Still connected.'):'Try switching to Computer.'}</div></div>`}
function device(){return `<button class="device" id="target" data-action="connect"><span class="disc">${icon(action?'check':'laptop')}</span><span>MacBook Pro</span><small>${action?'Connected':'Tap to connect'}</small></button>`}
function together(){return `<div class="card" id="target"><h3>Nearby phones</h3><button class="quiet" data-action="share" style="display:flex;align-items:center;gap:12px">${icon('phone')}Alex’s phone <span style="margin-left:auto">↗</span></button><p>${action?'Demo · choose a recipient in the share sheet.':'Tap a phone to share PairIt.'}</p></div>`}
function deck(){let visual=step===0?`<div class="card" style="background:#ffffff0c;color:white;padding:24px">${device()}<div class="result light">${action?'Connected. Ready to listen.':'Tap the computer to try it.'}</div></div>`:step===1?output():step===2?notification():together();return `<section class="deck"><div class="skip"><span class="sub">${step+1} of 4</span><button data-action="skip">Skip tour</button></div><h2>${titles[step]}</h2><p>${message()}</p><div class="visual">${visual}</div><div class="steps">${[0,1,2,3].map(i=>`<i class="${i===step?'on':''}"></i>`).join('')}</div><button class="primary" style="background:white;color:#111" data-action="next">${step===3?'Start using PairIt':'Continue'}</button>${step?'<button class="textbutton" style="color:#ccc" data-action="back">Back</button>':'<div class="sub" style="text-align:center;font-size:11px">You can replay this in Settings.</div>'}<div class="home"></div></section>`}
function render(){
 $('#phone').innerHTML=`<div class="brand">${icon('headphones')}PairIt</div><span class="demoTag">DEMO</span>${deck()}`;
 requestAnimationFrame(fit);
 const next=$('[data-action="next"]');next.setAttribute('aria-label',step===3?'Start using PairIt':'Continue to step '+(step+2));
}
function fit(){
 const deck=$('.deck'), phone=$('#phone');
 const children=Array.from(deck.children).filter(el=>getComputedStyle(el).display!=='none');
 const needed=children.reduce((sum,el)=>sum+(el.classList.contains('visual')?150:el.getBoundingClientRect().height),0)+17*(children.length-1)+76;
 phone.style.minHeight=Math.max(innerHeight,Math.ceil(needed))+'px';
}
window.addEventListener('resize',fit);
function finish(){location.href='pairit-tour://finish/'}
function next(){if(step===3){finish();return}step++;action=false;paused=false;computer=false;disconnected=false;render()}
function demo(){action=true;render()}
$('#phone').addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='next')next();
 else if(a==='back'){step=Math.max(0,step-1);action=false;paused=false;computer=false;disconnected=false;render()}
 else if(a==='skip')finish();
 else if(a==='computer'||a==='notify-output'){computer=true;paused=false;demo()}
 else if(a==='phone'){computer=false;demo()}
 else if(a==='pause'){if(computer){computer=false;paused=false}else paused=!paused;demo()}
 else if(a==='disconnect'){disconnected=true;demo()}
 else if(a==='try-again'){disconnected=false;paused=false;computer=false;demo()}
 else if(a==='connect'||a==='share')demo();
 else {const messages={route:'Output opens your connected audio devices.',audio:'Audio opens volume and Refresh audio.',more:'More includes Pair another computer and Disconnect.'};const el=$('.result');if(el)el.textContent=messages[a]||''}
});
render();
</script></body></html>
