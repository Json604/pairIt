services:
  reports:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
