name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Release checks and script syntax
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check-update-feed.py --offline
          python3 -m compileall -q scripts android/tests
          for script in scripts/*.sh; do bash -n "$script"; done
          git diff --check
      - name: Generated documents stay current
        run: |
          python3 scripts/prepare-play-content.py
          python3 scripts/generate-ios-project.py
          git diff --exit-code -- android/assets android/res/values/strings.xml ios/AudioRelay.xcodeproj
      - name: Scan complete Git history for credentials
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build Preview and run lint
        run: |
          python3 scripts/verify-listening-invitations.py
          python3 android/tests/verify-core.py
          PAIRIT_ANDROID_UI_PREVIEW=1 bash scripts/build-android.sh
          cd android
          ./gradlew lintDebug -PpairitUiPreview=true --console=plain

  apple:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Mac universal build
        run: bash scripts/build-mac.sh
      - name: Synthetic protocol and identity regressions
        run: |
          python3 scripts/verify-listening-invitations.py
          python3 scripts/verify-feature-server.py
          python3 scripts/verify-feature-gateway.py
          python3 scripts/verify-receiver-handoff.py
          xcrun swiftc ios/AudioRelay/RemotePlaybackCommand.swift scripts/RemotePlaybackCheck.swift -o artifacts/remote-playback-check
          artifacts/remote-playback-check
          xcrun swiftc ios/AudioRelay/ExternalOutputRecovery.swift scripts/ExternalOutputRecoveryCheck.swift -o artifacts/output-recovery-check
          artifacts/output-recovery-check
          xcrun swiftc -swift-version 5 -framework Security mac/LocalIdentity.swift mac/tests/LocalIdentityCheck.swift -o artifacts/local-identity-check
          artifacts/local-identity-check
          xcrun swiftc -swift-version 5 apple/RelayStyle.swift apple/ReleaseUpdates.swift mac/tests/ReleaseUpdateCheck.swift -o artifacts/release-update-check
          artifacts/release-update-check
      - name: Computer volume protocol and PCM checks
        run: |
          xcrun swiftc apple/ComputerVolume.swift scripts/ComputerVolumeCheck.swift -o artifacts/computer-volume-check
          artifacts/computer-volume-check
      - name: iOS simulator build
        run: bash scripts/build-ios.sh simulator

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/global.json
      - name: Build and synthetic protocol regressions
        shell: pwsh
        run: ./scripts/build-windows.ps1

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: linux/global.json
      - name: Install desktop and audio test dependencies
        run: sudo apt-get update && sudo apt-get install -y pulseaudio pulseaudio-utils xvfb libx11-6 libice6 libsm6 libfontconfig1
      - name: Build x64 and verify capture and graphical startup
        run: |
          bash scripts/build-linux.sh
          bash scripts/check-linux-runtime.sh
      - name: Cross-build ARM64
        run: PAIRIT_LINUX_RID=linux-arm64 bash scripts/build-linux.sh
