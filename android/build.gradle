plugins { id 'com.android.application' version '9.5.2' }

def releaseInfo = new groovy.json.JsonSlurper().parse(file('../release/google-play/release.json'))
def adsInfo = releaseInfo.admob ?: [:]
def liveAds = adsInfo.mode == 'live'
def testAppId = 'ca-app-pub-3940256099942544~3347511713'
def testBannerId = 'ca-app-pub-3940256099942544/6300978111'
def testAppOpenId = 'ca-app-pub-3940256099942544/9257395921'
if (liveAds && (!(adsInfo.app_id ==~ /ca-app-pub-\d{16}~\d{10}/) || !(adsInfo.banner_id ==~ /ca-app-pub-\d{16}\/\d{10}/) || adsInfo.app_id.startsWith('ca-app-pub-3940256099942544'))) {
    throw new GradleException('Live ads require your own valid AdMob App ID and banner ID in release.json')
}

android {
    namespace 'dev.bluetoothswitch.relay'
    compileSdk 36
    defaultConfig {
        applicationId releaseInfo.application_id
        minSdk 29
        targetSdk 36
        versionCode releaseInfo.version_code as int
        versionName releaseInfo.version_name
        manifestPlaceholders = [admobAppId: liveAds ? adsInfo.app_id : testAppId, appLabel: '@string/app_name']
        buildConfigField 'String', 'BANNER_AD_UNIT_ID', '"' + (liveAds ? adsInfo.banner_id : testBannerId) + '"'
        buildConfigField 'boolean', 'ADS_TEST_MODE', liveAds ? 'false' : 'true'
        buildConfigField 'String', 'APP_OPEN_AD_UNIT_ID', '"' + (liveAds ? (adsInfo.app_open_id ?: '') : testAppOpenId) + '"'
    }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res']; assets.srcDirs = ['assets'] } }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs {
        debug {
            storeFile file('build/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (System.getenv('RELAY_KEYSTORE')) {
                storeFile file(System.getenv('RELAY_KEYSTORE'))
                storePassword System.getenv('RELAY_STORE_PASSWORD')
                keyAlias System.getenv('RELAY_KEY_ALIAS')
                keyPassword System.getenv('RELAY_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: testAppId, appLabel: '@string/app_name']
            if (project.hasProperty('pairitUiPreview')) applicationIdSuffix '.preview'
            buildConfigField 'String', 'BANNER_AD_UNIT_ID', '"' + testBannerId + '"'
            buildConfigField 'boolean', 'ADS_TEST_MODE', 'true'
            buildConfigField 'String', 'APP_OPEN_AD_UNIT_ID', '"' + testAppOpenId + '"'
        }
        release { debuggable false; minifyEnabled false; if (System.getenv('RELAY_KEYSTORE')) signingConfig signingConfigs.release }
    }
    lint { abortOnError true; checkReleaseBuilds true; htmlReport true; textReport true }
}

dependencies {
    constraints {
        implementation('com.google.guava:guava:33.8.0-android') {
            because 'Replace the ads SDK transitive 31.1 dependency with fixes for temporary-file disclosure, deserialization and hash-flooding advisories'
        }
    }
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
